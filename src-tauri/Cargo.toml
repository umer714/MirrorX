[package]
name = "mirrorx"
version = "0.1.0"
description = "MirrorX Android screen mirroring desktop app"
authors = ["MirrorX contributors"]
edition = "2021"

[lib]
name = "mirrorx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mirrorx-media = { path = "../crates/mirrorx-media" }
