name: MirrorX Windows installer

on:
  workflow_dispatch:
  push:
    branches: [feature/mobile-apps]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.*"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Windows app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          $bitmap = [System.Drawing.Bitmap]::new(256, 256)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.Clear([System.Drawing.Color]::FromArgb(91, 63, 211))
          $font = [System.Drawing.Font]::new("Arial", 150, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $brush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::White)
          $graphics.DrawString("M", $font, $brush, 34, 24)
          $bitmap.Save("src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $stream = [System.IO.MemoryStream]::new()
          $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Png)
          $png = $stream.ToArray()
          $header = [byte[]](@(0, 0, 1, 0, 1, 0, 0, 0, 0, 0, 1, 0, 32, 0) + [BitConverter]::GetBytes([int]$png.Length) + [BitConverter]::GetBytes([int]22))
          [System.IO.File]::WriteAllBytes("src-tauri/icons/icon.ico", [byte[]]($header + $png))
          $graphics.Dispose()
          $font.Dispose()
          $brush.Dispose()
          $bitmap.Dispose()
          $stream.Dispose()

      - name: Build Windows MSI
        run: npm run tauri -- build --bundles msi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mirrorx-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
